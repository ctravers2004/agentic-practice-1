<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Flying pelican above a blue bike</title>

  <!-- ================= ANIMATION SETTINGS ================= -->
  <defs>
    <!-- The bird lifts off the seat and gently bobs while hovering -->
    <animateTransform id="lift-off"
      href="#pelican" attributeName="transform" type="translate"
      values="0 0; 0 -95; 0 -85; 0 -95; 0 -85; 0 0"
      keyTimes="0; 0.18; 0.32; 0.5; 0.66; 1"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.45 0 0.55 1; 0.4 0 0.2 1"
      dur="6s" repeatCount="indefinite"/>
    <animateTransform id="wheel-spin"
      href="#rear-wheel" attributeName="transform" type="rotate"
      values="0 300 445; 360 300 445" dur="2s" repeatCount="indefinite"/>
    <animateTransform id="wheel-spin-2"
      href="#front-wheel" attributeName="transform" type="rotate"
      values="0 500 445; 360 500 445" dur="2s" repeatCount="indefinite"/>
  </defs>

  <!-- Sky background -->
  <rect x="0" y="0" width="800" height="600" fill="#bfe3f5"/>

  <!-- Sun -->
  <circle cx="680" cy="90" r="45" fill="#ffe066"/>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="150" cy="100" rx="60" ry="28"/>
    <ellipse cx="200" cy="88" rx="45" ry="24"/>
    <ellipse cx="110" cy="92" rx="38" ry="20"/>
  </g>

  <!-- Ground -->
  <rect x="0" y="470" width="800" height="130" fill="#9bd47a"/>
  <!-- Road -->
  <rect x="0" y="470" width="800" height="35" fill="#7a7a7a"/>
  <g stroke="#ffffff" stroke-width="4" stroke-dasharray="30 25">
    <line x1="0" y1="487" x2="800" y2="487"/>
  </g>


  <!-- ================= BICYCLE (realistic) ================= -->

  <!-- Rear wheel: chain and gear sit behind the spokes -->
  <circle cx="300" cy="445" r="20" fill="none" stroke="#8b939c" stroke-width="4" stroke-dasharray="4 3"/>
  <circle cx="300" cy="445" r="14" fill="#a7afb8" stroke="#6f7883" stroke-width="2"/>

  <!-- rear-wheel -->
  <g id="rear-wheel">
    <!-- Tyre -->
    <circle cx="300" cy="445" r="64" fill="none" stroke="#1a1a1a" stroke-width="11"/>
    <!-- Tread highlight -->
    <circle cx="300" cy="445" r="64" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5 7" opacity="0.7"/>
    <!-- Rim -->
    <circle cx="300" cy="445" r="54" fill="none" stroke="#b8bfc7" stroke-width="4"/>
    <!-- Spokes -->
    <g stroke="#c8ced6" stroke-width="1.4" opacity="0.95">
<line x1="308.0" y1="445.0" x2="353.0" y2="445.0"/>
<line x1="307.4" y1="448.1" x2="349.0" y2="465.3"/>
<line x1="305.7" y1="450.7" x2="337.5" y2="482.5"/>
<line x1="303.1" y1="452.4" x2="320.3" y2="494.0"/>
<line x1="300.0" y1="453.0" x2="300.0" y2="498.0"/>
<line x1="296.9" y1="452.4" x2="279.7" y2="494.0"/>
<line x1="294.3" y1="450.7" x2="262.5" y2="482.5"/>
<line x1="292.6" y1="448.1" x2="251.0" y2="465.3"/>
<line x1="292.0" y1="445.0" x2="247.0" y2="445.0"/>
<line x1="292.6" y1="441.9" x2="251.0" y2="424.7"/>
<line x1="294.3" y1="439.3" x2="262.5" y2="407.5"/>
<line x1="296.9" y1="437.6" x2="279.7" y2="396.0"/>
<line x1="300.0" y1="437.0" x2="300.0" y2="392.0"/>
<line x1="303.1" y1="437.6" x2="320.3" y2="396.0"/>
<line x1="305.7" y1="439.3" x2="337.5" y2="407.5"/>
<line x1="307.4" y1="441.9" x2="349.0" y2="424.7"/>

    </g>
    <!-- Hub -->
    <circle cx="300" cy="445" r="8" fill="#9aa3ad" stroke="#6f7883" stroke-width="1.5"/>
    <circle cx="300" cy="445" r="3" fill="#5a636d"/>
    <use href="#wheel-spin"/>
  </g>
  
  <!-- Chain: a silver loop from the rear gear to the front crank -->
  <path d="M300 431 L400 431 A14 14 0 0 1 400 459 L300 459 A20 20 0 0 1 300 431 Z"
        fill="none" stroke="#8b939c" stroke-width="4" stroke-dasharray="3 2"/>


  <!-- front-wheel -->
  <g id="front-wheel">
    <!-- Tyre -->
    <circle cx="500" cy="445" r="64" fill="none" stroke="#1a1a1a" stroke-width="11"/>
    <!-- Tread highlight -->
    <circle cx="500" cy="445" r="64" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="5 7" opacity="0.7"/>
    <!-- Rim -->
    <circle cx="500" cy="445" r="54" fill="none" stroke="#b8bfc7" stroke-width="4"/>
    <!-- Spokes -->
    <g stroke="#c8ced6" stroke-width="1.4" opacity="0.95">
<line x1="508.0" y1="445.0" x2="553.0" y2="445.0"/>
<line x1="507.4" y1="448.1" x2="549.0" y2="465.3"/>
<line x1="505.7" y1="450.7" x2="537.5" y2="482.5"/>
<line x1="503.1" y1="452.4" x2="520.3" y2="494.0"/>
<line x1="500.0" y1="453.0" x2="500.0" y2="498.0"/>
<line x1="496.9" y1="452.4" x2="479.7" y2="494.0"/>
<line x1="494.3" y1="450.7" x2="462.5" y2="482.5"/>
<line x1="492.6" y1="448.1" x2="451.0" y2="465.3"/>
<line x1="492.0" y1="445.0" x2="447.0" y2="445.0"/>
<line x1="492.6" y1="441.9" x2="451.0" y2="424.7"/>
<line x1="494.3" y1="439.3" x2="462.5" y2="407.5"/>
<line x1="496.9" y1="437.6" x2="479.7" y2="396.0"/>
<line x1="500.0" y1="437.0" x2="500.0" y2="392.0"/>
<line x1="503.1" y1="437.6" x2="520.3" y2="396.0"/>
<line x1="505.7" y1="439.3" x2="537.5" y2="407.5"/>
<line x1="507.4" y1="441.9" x2="549.0" y2="424.7"/>

    </g>
    <!-- Hub -->
    <circle cx="500" cy="445" r="8" fill="#9aa3ad" stroke="#6f7883" stroke-width="1.5"/>
    <circle cx="500" cy="445" r="3" fill="#5a636d"/>
    <use href="#wheel-spin-2"/>
  </g>
  

  <!-- Front fork -->
  <path d="M490 330 Q503 388 500 445" fill="none" stroke="#9aa3ad" stroke-width="6" stroke-linecap="round"/>

  <!-- Frame tubes: darker edge under the blue for a rounded-tube look -->
  <g fill="none" stroke-linecap="round">
    <g stroke="#123aa8" stroke-width="10">
      <path d="M300 445 L360 445 L400 335 Z"/>
      <line x1="400" y1="335" x2="360" y2="445"/>
      <line x1="400" y1="335" x2="490" y2="330"/>
      <line x1="360" y1="445" x2="400" y2="335"/>
      <line x1="360" y1="445" x2="352" y2="330"/>
    </g>
    <g stroke="#1d4ed8" stroke-width="7">
      <path d="M300 445 L360 445 L400 335 Z"/>
      <line x1="400" y1="335" x2="360" y2="445"/>
      <line x1="400" y1="335" x2="490" y2="330"/>
      <line x1="360" y1="445" x2="400" y2="335"/>
      <line x1="360" y1="445" x2="352" y2="330"/>
    </g>
    <!-- Thin highlight down the top tube -->
    <line x1="402" y1="331" x2="452" y2="332" stroke="#5b84f0" stroke-width="2"/>
  </g>

  <!-- Saddle -->
  <path d="M325 322 Q340 310 378 314 Q386 316 380 322 L336 326 Q326 326 325 322 Z"
        fill="#2b2b2b" stroke="#111" stroke-width="1.5"/>
  <!-- Seat post -->
  <line x1="360" y1="445" x2="354" y2="322" stroke="#9aa3ad" stroke-width="5" stroke-linecap="round"/>

  <!-- Head tube, stem and handlebar -->
  <line x1="490" y1="330" x2="505" y2="290" stroke="#9aa3ad" stroke-width="7" stroke-linecap="round"/>
  <line x1="480" y1="285" x2="525" y2="285" stroke="#6f7883" stroke-width="6" stroke-linecap="round"/>
  <!-- Grips -->
  <line x1="474" y1="285" x2="488" y2="285" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <line x1="517" y1="285" x2="531" y2="285" stroke="#222" stroke-width="9" stroke-linecap="round"/>
  <!-- Front brake -->
  <path d="M520 300 Q512 330 505 348" fill="none" stroke="#6f7883" stroke-width="3"/>
  <path d="M505 348 L500 372" fill="none" stroke="#6f7883" stroke-width="3"/>

  <!-- Crank and pedals -->
  <circle cx="400" cy="445" r="15" fill="#c8ced6" stroke="#6f7883" stroke-width="2"/>
  <circle cx="400" cy="445" r="4" fill="#5a636d"/>
  <line x1="375" y1="470" x2="425" y2="420" stroke="#7a838d" stroke-width="5" stroke-linecap="round"/>
  <rect x="360" y="464" width="28" height="9" rx="3" fill="#222"/>
  <rect x="412" y="414" width="28" height="9" rx="3" fill="#222"/>

  <!-- Chain guard (blue painted cover) -->
  <path d="M312 432 L392 430 Q402 432 402 438 L402 450 Q402 456 394 456 L314 458 Q306 456 306 448 Q306 436 312 432 Z"
        fill="#1d4ed8" stroke="#123aa8" stroke-width="2" opacity="0.95"/>


  <!-- ================= PELICAN ================= -->
  <!-- The whole bird is grouped so it can rise off the seat -->
  <g id="pelican">
    <use href="#lift-off"/>

    <!-- Tail feathers -->
    <path d="M368 300 C340 305 335 330 350 345 C365 330 372 315 368 300 Z" fill="#f2f2f2" stroke="#c9c9c9" stroke-width="2"/>

    <!-- Body -->
    <ellipse cx="405" cy="285" rx="62" ry="45" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>

    <!-- Wing on the far side of the body (behind body) -->
    <path d="M410 265 C380 250 340 250 318 265 C340 268 345 280 350 290 C370 295 400 290 410 265 Z"
          fill="#dcdcdc" stroke="#b8b8b8" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        values="0 410 272; 26 410 272; 0 410 272"
        dur="0.6s" repeatCount="indefinite"/>
    </path>

    <!-- Legs tucked up beneath the body -->
    <path d="M390 322 L398 345" stroke="#f39c12" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M398 345 L388 355 L400 352 L398 360 L410 346 Z" fill="#f39c12" stroke="#d4880f" stroke-width="2"/>
    <path d="M425 320 L433 342" stroke="#f39c12" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M433 342 L423 352 L435 349 L433 357 L445 343 Z" fill="#f39c12" stroke="#d4880f" stroke-width="2"/>

    <!-- Neck -->
    <path d="M440 265 C470 250 460 205 470 185 C480 165 505 160 515 170 C520 180 505 200 495 215 C480 240 475 265 455 290 Z"
          fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>

    <!-- Head -->
    <circle cx="505" cy="165" r="30" fill="#ffffff" stroke="#c9c9c9" stroke-width="2"/>

    <!-- Eye -->
    <circle cx="515" cy="155" r="6" fill="#222"/>
    <circle cx="517" cy="153" r="2" fill="#ffffff"/>

    <!-- Beak, upper -->
    <path d="M530 168 C575 160 615 175 630 195 C600 195 560 200 532 192 Z"
          fill="#f5b041" stroke="#d4880f" stroke-width="2"/>
    <!-- Beak pouch (lower) -->
    <path d="M532 190 C565 200 600 210 622 200 C590 235 545 220 530 205 Z"
          fill="#f7c873" stroke="#d4880f" stroke-width="2"/>
    <!-- Fish poking out -->
    <g transform="translate(600 198)">
      <ellipse cx="0" cy="0" rx="22" ry="9" fill="#7fb3d5" stroke="#4a7fa5" stroke-width="1.5"/>
      <path d="M-20 0 L-32 -8 L-32 8 Z" fill="#7fb3d5" stroke="#4a7fa5" stroke-width="1.5"/>
      <circle cx="14" cy="-2" r="2" fill="#222"/>
    </g>

    <!-- Near wing, flapping over the body -->
    <path d="M380 255 C415 245 455 265 455 290 C450 315 420 320 400 310 C385 300 372 278 380 255 Z"
          fill="#e8e8e8" stroke="#c9c9c9" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate"
        values="0 420 285; 30 420 285; 0 420 285"
        dur="0.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Motion lines behind the hover -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="180" y1="250" x2="120" y2="250"/>
    <line x1="200" y1="290" x2="140" y2="290"/>
    <line x1="190" y1="330" x2="145" y2="330"/>
  </g>
</svg>
